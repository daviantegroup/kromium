name: Publish Release to Maven Central

on:
  pull_request:
    types: [closed]
    branches:
      - master
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build, test, sign, and verify bundle without uploading)'
        required: true
        type: boolean
        default: false
      publishing_type:
        description: 'Sonatype Central publishing mode (AUTOMATIC publishes directly after validation, USER_MANAGED requires manual approval in portal)'
        required: true
        type: choice
        options:
          - AUTOMATIC
          - USER_MANAGED
        default: AUTOMATIC

concurrency:
  group: publish-maven-central
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: read

jobs:
  publish:
    name: Build, Sign & Publish to Maven Central
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0

      - name: Check Trigger Condition (PR Merge & JAR Update)
        id: check_trigger
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ github.event.pull_request.merged }}" != "true" ]; then
              echo "Pull request was closed without merging. Skipping release."
              echo "proceed=false" >> $GITHUB_OUTPUT
              exit 0
            fi

            echo "Examining files changed in merged PR #${{ github.event.pull_request.number }}..."
            CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.merge_commit_sha }} 2>/dev/null || git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
            echo "Changed files:"
            echo "$CHANGED_FILES"

            if echo "$CHANGED_FILES" | grep -E "kromium-core/libs/jcef\.jar|jcef-version\.txt"; then
              echo "🚀 JCEF JAR update detected in merged PR! Proceeding with automated Maven release."
              echo "proceed=true" >> $GITHUB_OUTPUT
            else
              echo "ℹ️ Pull request did not update JCEF JAR. Skipping automated release."
              echo "proceed=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          else
            echo "Direct release or manual workflow dispatch. Proceeding."
            echo "proceed=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 21
        if: steps.check_trigger.outputs.proceed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        if: steps.check_trigger.outputs.proceed == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        if: steps.check_trigger.outputs.proceed == 'true'
        run: chmod +x ./gradlew

      - name: Validate Release Version & Secrets Pre-flight
        if: steps.check_trigger.outputs.proceed == 'true'
        id: preflight
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          IS_DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          echo "=== 1. Checking Project Version ==="
          PROJECT_VERSION=$(./gradlew properties --property version -q | awk '{print $2}')
          echo "Gradle Project Version: $PROJECT_VERSION"
          echo "project_version=$PROJECT_VERSION" >> $GITHUB_OUTPUT

          if [ "${{ github.event_name }}" = "release" ]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
            STRIPPED_TAG="${TAG_NAME#v}"
            echo "GitHub Release Tag: $TAG_NAME (normalized: $STRIPPED_TAG)"
            if [ "$STRIPPED_TAG" != "$PROJECT_VERSION" ]; then
              echo "::error::Release tag '$TAG_NAME' does not match Gradle project version '$PROJECT_VERSION'! Aborting release."
              exit 1
            fi
            echo "Release tag and Gradle version match perfectly ($PROJECT_VERSION)."
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --tags
            if git rev-parse "v$PROJECT_VERSION" >/dev/null 2>&1; then
              echo "::warning::Tag v$PROJECT_VERSION already exists. Skipping duplicate publish."
              echo "proceed=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          echo "=== 2. Validating Secrets ==="
          MISSING_SECRETS=0
          if [ -z "$GPG_SIGNING_KEY" ]; then
            if [ "$IS_DRY_RUN" = "true" ]; then
              echo "::warning::GPG_SIGNING_KEY is not set. Dry-run will generate unsigned artifacts."
            else
              echo "::error::GPG_SIGNING_KEY secret is required for Maven Central releases!"
              MISSING_SECRETS=1
            fi
          fi

          if [ "$IS_DRY_RUN" != "true" ]; then
            if [ -z "$SONATYPE_USERNAME" ] || [ -z "$SONATYPE_PASSWORD" ]; then
              echo "::error::SONATYPE_USERNAME and SONATYPE_PASSWORD secrets are required for Central Portal upload!"
              MISSING_SECRETS=1
            fi
          fi

          if [ "$MISSING_SECRETS" -eq 1 ]; then
            exit 1
          fi
          echo "proceed=true" >> $GITHUB_OUTPUT
          echo "Pre-flight validation passed successfully."

      - name: Run Test Suite
        if: steps.check_trigger.outputs.proceed == 'true' && steps.preflight.outputs.proceed == 'true'
        run: ./gradlew test

      - name: Create Git Tag and GitHub Release
        if: steps.check_trigger.outputs.proceed == 'true' && steps.preflight.outputs.proceed == 'true' && github.event_name == 'pull_request' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PROJECT_VERSION="${{ steps.preflight.outputs.project_version }}"
          TAG_NAME="v$PROJECT_VERSION"
          echo "Creating Git Tag: $TAG_NAME"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
          git push origin "$TAG_NAME"

          UPSTREAM_VER=$(cat jcef-version.txt 2>/dev/null || echo "")

          echo "Creating GitHub Release for $TAG_NAME..."
          {
            echo "### Automated Release $TAG_NAME"
            echo ""
            echo "- **Chromium / JCEF Runtime**: \`$UPSTREAM_VER\`"
            echo "- **Compose Multiplatform Coordinates**: \`dev.daviante:kromium-compose:$PROJECT_VERSION\`"
            echo "- **Core JVM Coordinates**: \`dev.daviante:kromium-core:$PROJECT_VERSION\`"
            echo ""
            echo "Published automatically via JCEF update merge."
          } > release_notes.md

          gh release create "$TAG_NAME" \
            --title "Kromium $TAG_NAME" \
            --notes-file release_notes.md

      - name: Build, Sign & Package Publications
        if: steps.check_trigger.outputs.proceed == 'true' && steps.preflight.outputs.proceed == 'true'
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}
        run: |
          ./gradlew clean bundlePublishing --no-daemon

      - name: Verify Bundle Integrity
        if: steps.check_trigger.outputs.proceed == 'true' && steps.preflight.outputs.proceed == 'true'
        id: verify-bundle
        env:
          IS_DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          if [ ! -f "build/bundle.zip" ]; then
            echo "::error::build/bundle.zip was not generated!"
            exit 1
          fi

          echo "Listing contents of build/bundle.zip:"
          unzip -l build/bundle.zip

          echo "=== Checking Required POM and JAR artifacts ==="
          for mod in kromium-core kromium-compose; do
            unzip -l build/bundle.zip | grep -q "dev/daviante/$mod/" || {
              echo "::error::Missing $mod in bundle.zip!"
              exit 1
            }
            unzip -l build/bundle.zip | grep -q "$mod-.*\.pom" || {
              echo "::error::Missing $mod POM in bundle.zip!"
              exit 1
            }
            unzip -l build/bundle.zip | grep -q "$mod-.*-sources\.jar" || {
              echo "::error::Missing $mod sources jar in bundle.zip!"
              exit 1
            }
            unzip -l build/bundle.zip | grep -q "$mod-.*-javadoc\.jar" || {
              echo "::error::Missing $mod javadoc jar in bundle.zip!"
              exit 1
            }
          done

          if [ "$IS_DRY_RUN" != "true" ]; then
            echo "=== Verifying GPG Signatures (.asc) ==="
            ASC_COUNT=$(unzip -l build/bundle.zip | grep -c "\.asc" || true)
            if [ "$ASC_COUNT" -eq 0 ]; then
              echo "::error::No GPG signature (.asc) files found in bundle.zip! Artifacts must be signed for Maven Central."
              exit 1
            fi
            echo "Verified $ASC_COUNT cryptographic signatures (.asc) in bundle.zip."
          else
            echo "Dry run: Skipping GPG signature check."
          fi

      - name: Archive Bundle as Workflow Artifact
        if: steps.check_trigger.outputs.proceed == 'true' && steps.preflight.outputs.proceed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: maven-central-bundle
          path: build/bundle.zip
          retention-days: 14

      - name: Upload to Sonatype Central Portal
        if: steps.check_trigger.outputs.proceed == 'true' && steps.preflight.outputs.proceed == 'true' && inputs.dry_run != true
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          PUBLISHING_TYPE: ${{ inputs.publishing_type || 'AUTOMATIC' }}
        run: |
          echo "Generating Sonatype Publisher authorization token..."
          AUTH_TOKEN=$(printf "%s:%s" "$SONATYPE_USERNAME" "$SONATYPE_PASSWORD" | base64 -w 0)
          
          echo "Uploading build/bundle.zip to Sonatype Central Portal..."
          echo "Publishing Mode: $PUBLISHING_TYPE"
          
          HTTP_RESPONSE=$(curl --silent --show-error \
            --write-out "\nHTTP_STATUS:%{http_code}" \
            --request POST \
            --header "Authorization: Bearer $AUTH_TOKEN" \
            --form "bundle=@build/bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=$PUBLISHING_TYPE")

          HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n 1 | cut -d':' -f2)

          echo "HTTP Response Status: $HTTP_STATUS"
          echo "HTTP Response Body: $HTTP_BODY"

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Sonatype Central Portal upload failed with HTTP status $HTTP_STATUS: $HTTP_BODY"
            exit 1
          fi

          DEPLOYMENT_ID=$(echo "$HTTP_BODY" | tr -d '"\r\n ')
          echo "=========================================================="
          echo "🚀 Sonatype Central Portal Upload Succeeded!"
          echo "Deployment ID: $DEPLOYMENT_ID"
          echo "Track Validation & Publication Status:"
          echo "https://central.sonatype.com/publishing/deployments/$DEPLOYMENT_ID"
          echo "=========================================================="
