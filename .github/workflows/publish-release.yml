name: Publish Release to Maven Central

on:
  pull_request:
    types: [closed]
    branches:
      - master
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      custom_notes:
        description: 'Custom release notes in Markdown (optional: leave empty to extract automatically from CHANGELOG.md)'
        required: false
        type: string
        default: ''
      force:
        description: 'Force publish even if git tag already exists'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Dry run (build, test, sign, and verify bundle without uploading)'
        required: true
        type: boolean
        default: false
      publishing_type:
        description: 'Sonatype Central publishing mode (AUTOMATIC publishes directly after validation, USER_MANAGED requires manual approval in portal)'
        required: true
        type: choice
        options:
          - AUTOMATIC
          - USER_MANAGED
        default: AUTOMATIC

concurrency:
  group: publish-maven-central
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: read

jobs:
  publish:
    name: Build, Sign & Publish to Maven Central
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Generate GitHub App Token for Daviante Releaser
        id: app_token
        uses: actions/create-github-app-token@v1
        continue-on-error: true
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          token: ${{ steps.app_token.outputs.token || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Check Trigger Condition (PR Merge & JAR Update)
        id: check_trigger
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ github.event.pull_request.merged }}" != "true" ]; then
              echo "Pull request was closed without merging. Skipping release."
              echo "proceed=false" >> $GITHUB_OUTPUT
              exit 0
            fi

            echo "Examining files changed in merged PR #${{ github.event.pull_request.number }}..."
            CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.merge_commit_sha }} 2>/dev/null || git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
            echo "Changed files:"
            echo "$CHANGED_FILES"

            if echo "$CHANGED_FILES" | grep -E "kromium-core/libs/jcef\.jar|jcef-version\.txt"; then
              echo "🚀 JCEF JAR update detected in merged PR! Proceeding with automated Maven release."
              echo "proceed=true" >> $GITHUB_OUTPUT
            else
              echo "ℹ️ Pull request did not update JCEF JAR. Skipping automated release."
              echo "proceed=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          elif [ "${{ github.event_name }}" = "push" ]; then
            TAG_NAME="${{ github.ref_name }}"
            echo "Tag push event detected for $TAG_NAME. Checking if release already exists..."
            if gh release view "$TAG_NAME" >/dev/null 2>&1; then
              echo "Release $TAG_NAME already created by PR merge. Skipping duplicate tag run."
              echo "proceed=false" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "New standalone tag push without existing release. Proceeding."
            echo "proceed=true" >> $GITHUB_OUTPUT
          else
            echo "Direct release or manual workflow dispatch. Proceeding."
            echo "proceed=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 21
        if: steps.check_trigger.outputs.proceed == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        if: steps.check_trigger.outputs.proceed == 'true'
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        if: steps.check_trigger.outputs.proceed == 'true'
        run: chmod +x ./gradlew

      - name: Validate Release Version & Secrets Pre-flight
        if: steps.check_trigger.outputs.proceed == 'true'
        id: preflight
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          IS_DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          echo "=== 1. Checking Project Version ==="
          PROJECT_VERSION=$(grep -m1 'version = ' build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/' | tr -d '[:space:]')
          if [ -z "$PROJECT_VERSION" ]; then
            PROJECT_VERSION=$(./gradlew properties --property version -q | grep "^version:" | awk '{print $2}' | tr -d '[:space:]')
          fi
          echo "Project Version: '$PROJECT_VERSION'"
          echo "project_version=$PROJECT_VERSION" >> $GITHUB_OUTPUT

          if [ "${{ github.event_name }}" = "release" ]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
            STRIPPED_TAG="${TAG_NAME#v}"
            echo "GitHub Release Tag: $TAG_NAME (normalized: $STRIPPED_TAG)"
            if [ "$STRIPPED_TAG" != "$PROJECT_VERSION" ]; then
              echo "::error::Release tag '$TAG_NAME' does not match Gradle project version '$PROJECT_VERSION'! Aborting release."
              exit 1
            fi
            echo "Release tag and Gradle version match perfectly ($PROJECT_VERSION)."
          fi

          if [ "${{ github.event_name }}" = "push" ]; then
            TAG_NAME="${{ github.ref_name }}"
            STRIPPED_TAG="${TAG_NAME#v}"
            echo "Git Pushed Tag: $TAG_NAME (normalized: $STRIPPED_TAG)"
            if [ "$STRIPPED_TAG" != "$PROJECT_VERSION" ]; then
              echo "::error::Pushed tag '$TAG_NAME' does not match Gradle project version '$PROJECT_VERSION'! Aborting release."
              exit 1
            fi
            echo "Pushed tag and Gradle version match perfectly ($PROJECT_VERSION)."
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --tags
            if git rev-parse "v$PROJECT_VERSION" >/dev/null 2>&1; then
              echo "::warning::Tag v$PROJECT_VERSION already exists. Skipping duplicate PR publish."
              echo "proceed=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git fetch --tags
            if git rev-parse "v$PROJECT_VERSION" >/dev/null 2>&1; then
              echo "ℹ️ Tag v$PROJECT_VERSION already exists in repository. Proceeding with release and publication."
            fi
          fi

          echo "=== 2. Validating Secrets ==="
          MISSING_SECRETS=0
          if [ -z "$GPG_SIGNING_KEY" ]; then
            if [ "$IS_DRY_RUN" = "true" ]; then
              echo "::warning::GPG_SIGNING_KEY is not set. Dry-run will generate unsigned artifacts."
            else
              echo "::error::GPG_SIGNING_KEY secret is required for Maven Central releases!"
              MISSING_SECRETS=1
            fi
          fi

          if [ "$IS_DRY_RUN" != "true" ]; then
            if [ -z "$SONATYPE_USERNAME" ] || [ -z "$SONATYPE_PASSWORD" ]; then
              echo "::error::SONATYPE_USERNAME and SONATYPE_PASSWORD secrets are required for Central Portal upload!"
              MISSING_SECRETS=1
            fi
          fi

          if [ "$MISSING_SECRETS" -eq 1 ]; then
            exit 1
          fi
          echo "proceed=true" >> $GITHUB_OUTPUT
          echo "Pre-flight validation passed successfully."

      - name: Run Test Suite
        if: steps.check_trigger.outputs.proceed == 'true' && steps.preflight.outputs.proceed == 'true'
        run: ./gradlew test

      - name: Create Git Tag and GitHub Release
        if: steps.check_trigger.outputs.proceed == 'true' && steps.preflight.outputs.proceed == 'true' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'push') && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token || secrets.GITHUB_TOKEN }}
          CUSTOM_NOTES: ${{ inputs.custom_notes }}
        run: |
          PROJECT_VERSION="${{ steps.preflight.outputs.project_version }}"
          TAG_NAME="v$PROJECT_VERSION"

          if [ "${{ github.event_name }}" != "push" ]; then
            if ! git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
              echo "Creating Git Tag: $TAG_NAME"
              if [ -n "${{ steps.app_token.outputs.token }}" ]; then
                git config user.name "${{ steps.app_token.outputs.app-slug || 'daviante-releaser' }}"
                git config user.email "${{ steps.app_token.outputs.app-slug || 'daviante-releaser' }}@users.noreply.github.com"
              else
                git config user.name "daviante-releaser"
                git config user.email "daviante-releaser@users.noreply.github.com"
              fi
              git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
              git push origin "$TAG_NAME"
            else
              echo "Git tag $TAG_NAME already exists in repository."
            fi
          fi

          export PROJECT_VERSION="$PROJECT_VERSION"
          export TAG_NAME="$TAG_NAME"
          export UPSTREAM_VER="$(cat jcef-version.txt 2>/dev/null || echo '')"

          echo "Generating GitHub Release notes for $TAG_NAME..."
          python3 -c '
          import os, re

          version = os.environ.get("PROJECT_VERSION", "")
          tag_name = os.environ.get("TAG_NAME", "")
          upstream_ver = os.environ.get("UPSTREAM_VER", "")
          custom_notes = os.environ.get("CUSTOM_NOTES", "").strip()

          notes = custom_notes
          release_type = "Release"
          badge_color = "107c41"

          if not notes and os.path.exists("CHANGELOG.md"):
              with open("CHANGELOG.md", "r") as f:
                  content = f.read()

              header_match = re.search(rf"## \[{re.escape(version)}\]([^\n]*)", content)
              if header_match:
                  header_text = header_match.group(1).lower()
                  if "major" in header_text:
                      release_type = "Major_Release"
                      badge_color = "blueviolet"
                  elif "security" in header_text:
                      release_type = "Security_Patch"
                      badge_color = "d13438"
                  elif "minor" in header_text or "feature" in header_text:
                      release_type = "Feature_Release"
                      badge_color = "0078d4"

              pattern = rf"## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n---\n|\n## \[|\Z)"
              match = re.search(pattern, content, re.DOTALL)
              if match:
                  notes = match.group(1).strip()

          if not notes:
              notes = f"Automated update release of Kromium compiled against certified upstream JCEF runtime `{upstream_ver}`."

          type_badge = f"https://img.shields.io/badge/Type-{release_type}-{badge_color}?style=flat-square"
          cache_dir = re.sub(r"^[0-9]+\.[0-9]+\.", "", version)

          release_body = f"""<div align=\"center\">
            <img src=\"https://kromium.daviante.dev/android-chrome-192x192.png\" alt=\"Kromium Logo\" width=\"80\" height=\"80\" />
            <h2>Kromium {tag_name}</h2>
            <p>
              <img src=\"https://img.shields.io/badge/Channel-Stable-107c41?style=flat-square&logo=shield\" alt=\"Stable\" />
              <img src=\"{type_badge}\" alt=\"{release_type.replace('_', ' ')}\" />
              <img src=\"https://img.shields.io/badge/Engine-JetBrains_Certified_JCEF-5c2d91?style=flat-square\" alt=\"JetBrains Certified\" />
              <img src=\"https://img.shields.io/badge/Chromium-CEF_150-e36209?style=flat-square&logo=googlechrome\" alt=\"Chromium 150\" />
            </p>
          </div>

          {notes}

          #### 📦 Coordinates

          ```kotlin
          dependencies {{
              // Compose Multiplatform Desktop
              implementation(\"dev.daviante:kromium-compose:{version}\")

              // Standalone Kotlin JVM / Universal Java Desktop (Swing, AWT, SWT, JavaFX)
              implementation(\"dev.daviante:kromium-core:{version}\")
          }}
          ```

          ```xml
          <dependency>
              <groupId>dev.daviante</groupId>
              <artifactId>kromium-core</artifactId>
              <version>{version}</version>
          </dependency>
          ```

          #### ⚙️ Engine Details
          - **Upstream JCEF Runtime**: `{upstream_ver}`
          - **Native Cache Directory**: `jcef-{cache_dir}`

          📖 **Documentation**: [kromium.daviante.dev](https://kromium.daviante.dev) &bull; **Changelog**: [CHANGELOG.md](CHANGELOG.md)
          """

          with open("release_notes.md", "w") as f:
              f.write(release_body)
          '

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "GitHub release $TAG_NAME already exists. Updating release notes..."
            gh release edit "$TAG_NAME" \
              --title "Kromium $TAG_NAME" \
              --notes-file release_notes.md
          else
            echo "Creating GitHub Release for $TAG_NAME..."
            gh release create "$TAG_NAME" \
              --title "Kromium $TAG_NAME" \
              --notes-file release_notes.md
          fi

      - name: Build, Sign & Package Publications
        if: steps.check_trigger.outputs.proceed == 'true' && steps.preflight.outputs.proceed == 'true'
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}
        run: |
          ./gradlew clean bundlePublishing --no-daemon

      - name: Verify Bundle Integrity
        if: steps.check_trigger.outputs.proceed == 'true' && steps.preflight.outputs.proceed == 'true'
        id: verify-bundle
        env:
          IS_DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          if [ ! -f "build/bundle.zip" ]; then
            echo "::error::build/bundle.zip was not generated!"
            exit 1
          fi

          echo "Listing contents of build/bundle.zip:"
          unzip -l build/bundle.zip

          echo "=== Checking Required POM and JAR artifacts ==="
          for mod in kromium-core kromium-compose; do
            unzip -l build/bundle.zip | grep -q "dev/daviante/$mod/" || {
              echo "::error::Missing $mod in bundle.zip!"
              exit 1
            }
            unzip -l build/bundle.zip | grep -q "$mod-.*\.pom" || {
              echo "::error::Missing $mod POM in bundle.zip!"
              exit 1
            }
            unzip -l build/bundle.zip | grep -q "$mod-.*-sources\.jar" || {
              echo "::error::Missing $mod sources jar in bundle.zip!"
              exit 1
            }
            unzip -l build/bundle.zip | grep -q "$mod-.*-javadoc\.jar" || {
              echo "::error::Missing $mod javadoc jar in bundle.zip!"
              exit 1
            }
          done

          if [ "$IS_DRY_RUN" != "true" ]; then
            echo "=== Verifying GPG Signatures (.asc) ==="
            ASC_COUNT=$(unzip -l build/bundle.zip | grep -c "\.asc" || true)
            if [ "$ASC_COUNT" -eq 0 ]; then
              echo "::error::No GPG signature (.asc) files found in bundle.zip! Artifacts must be signed for Maven Central."
              exit 1
            fi
            echo "Verified $ASC_COUNT cryptographic signatures (.asc) in bundle.zip."
          else
            echo "Dry run: Skipping GPG signature check."
          fi

      - name: Archive Bundle as Workflow Artifact
        if: steps.check_trigger.outputs.proceed == 'true' && steps.preflight.outputs.proceed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: maven-central-bundle
          path: build/bundle.zip
          retention-days: 14

      - name: Upload to Sonatype Central Portal
        if: steps.check_trigger.outputs.proceed == 'true' && steps.preflight.outputs.proceed == 'true' && inputs.dry_run != true
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          PUBLISHING_TYPE: ${{ inputs.publishing_type || 'AUTOMATIC' }}
        run: |
          echo "Generating Sonatype Publisher authorization token..."
          AUTH_TOKEN=$(printf "%s:%s" "$SONATYPE_USERNAME" "$SONATYPE_PASSWORD" | base64 -w 0)
          
          echo "Uploading build/bundle.zip to Sonatype Central Portal..."
          echo "Publishing Mode: $PUBLISHING_TYPE"
          
          HTTP_RESPONSE=$(curl --silent --show-error \
            --write-out "\nHTTP_STATUS:%{http_code}" \
            --request POST \
            --header "Authorization: Bearer $AUTH_TOKEN" \
            --form "bundle=@build/bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=$PUBLISHING_TYPE")

          HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n 1 | cut -d':' -f2)

          echo "HTTP Response Status: $HTTP_STATUS"
          echo "HTTP Response Body: $HTTP_BODY"

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Sonatype Central Portal upload failed with HTTP status $HTTP_STATUS: $HTTP_BODY"
            exit 1
          fi

          DEPLOYMENT_ID=$(echo "$HTTP_BODY" | tr -d '"\r\n ')
          echo "=========================================================="
          echo "🚀 Sonatype Central Portal Upload Succeeded!"
          echo "Deployment ID: $DEPLOYMENT_ID"
          echo "Track Validation & Publication Status:"
          echo "https://central.sonatype.com/publishing/deployments/$DEPLOYMENT_ID"
          echo "=========================================================="

      - name: Publish to GitHub Packages (maven.pkg.github.com)
        if: steps.check_trigger.outputs.proceed == 'true' && steps.preflight.outputs.proceed == 'true' && inputs.dry_run != true
        continue-on-error: true
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}
        run: |
          echo "=========================================================="
          echo "📦 Publishing signed artifacts to GitHub Packages..."
          echo "Actor: $GITHUB_ACTOR"
          echo "Target: https://maven.pkg.github.com/daviantegroup/kromium"
          echo "=========================================================="
          ./gradlew publishAllPublicationsToGitHubPackagesRepository --no-daemon
          echo "🚀 Successfully published to GitHub Packages!"

      - name: Attach Bundle Asset to GitHub Release
        if: steps.check_trigger.outputs.proceed == 'true' && steps.preflight.outputs.proceed == 'true' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'push') && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v${{ steps.preflight.outputs.project_version }}"
          echo "Attaching build/bundle.zip to GitHub Release $TAG_NAME..."
          gh release upload "$TAG_NAME" build/bundle.zip --clobber
          echo "✅ Release asset attached successfully."

