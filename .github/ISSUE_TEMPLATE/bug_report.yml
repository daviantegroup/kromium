name: "🐛 Bug Report"
description: File a structured report to help us reproduce, diagnose, and fix an issue
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill out the sections below as completely as possible to help us quickly diagnose and resolve the issue.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight Verification
      description: Please confirm the following before opening this issue.
      options:
        - label: I have searched existing [open and closed issues](https://github.com/daviantegroup/kromium/issues) to ensure this is not a duplicate.
          required: true
        - label: I have verified this issue occurs on the latest stable release (v1.0.150+).
          required: true
        - label: I understand that questions or setup assistance should be opened in [Discussions](https://github.com/daviantegroup/kromium/discussions) instead.
          required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the problem, symptoms, and impact...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide clear, step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Initialize Kromium with `Kromium.initialize { ... }`
        2. Render `KromiumView(state = ...)`
        3. Navigate to 'https://...'
        4. Trigger JavaScript call / window resize / action
        5. Observe unexpected behavior or crash
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
      placeholder: What should happen under normal operation?
    validations:
      required: true

  - type: textarea
    id: code-snippet
    attributes:
      label: Minimal Reproducible Code Example
      description: Please provide a minimal Kotlin / Compose snippet reproducing the issue.
      render: kotlin
      placeholder: |
        // Minimal Kotlin / Compose snippet to reproduce
        @Composable
        fun MinimalBugDemo() {
            val state = rememberKromiumState("https://example.com")
            KromiumView(state = state, modifier = Modifier.fillMaxSize())
        }
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: Operating System & Architecture
      description: Which operating system and CPU architecture are you running on?
      options:
        - "Windows 11 (x64)"
        - "Windows 11 (ARM64)"
        - "Windows 10 (x64)"
        - "macOS Sequoia 15 (Apple Silicon / ARM64)"
        - "macOS Sonoma 14 (Apple Silicon / ARM64)"
        - "macOS (Intel / x64)"
        - "Linux - Ubuntu / Debian (x64)"
        - "Linux - Fedora / RHEL (x64)"
        - "Linux - Arch Linux (x64)"
        - "Other (please specify in Additional Context)"
    validations:
      required: true

  - type: input
    id: kromium-version
    attributes:
      label: Kromium Version
      description: The version of `kromium-compose` or `kromium-core` you are using.
      placeholder: "e.g. 1.0.150"
    validations:
      required: true

  - type: input
    id: jdk-version
    attributes:
      label: JDK Version & Vendor
      description: Output of `java -version` (e.g. Eclipse Temurin 21.0.2, JetBrains Runtime 21, Oracle JDK 21).
      placeholder: "e.g. Eclipse Temurin 21.0.2"
    validations:
      required: true

  - type: input
    id: compose-version
    attributes:
      label: JetBrains Compose Multiplatform Version
      description: If using `kromium-compose`, specify your Compose Desktop version.
      placeholder: "e.g. 1.7.3"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs, Stack Traces & Console Output
      description: Paste any relevant logcat, exception stack traces, or console output.
      render: text
      placeholder: |
        Paste full stack trace or console logs here...
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context (e.g., multi-monitor DPI scaling, proxy settings, windowless rendering mode, custom CEF flags).
    validations:
      required: false
